name: build-images

# Builds the deployment images and publishes them to GHCR so the SAME image
# tag you validate on a cheap GPU runs byte-identical on any larger GPU.
#
# Images:
#   ghcr.io/<owner>/discord-voice-assistant/va-server
#   ghcr.io/<owner>/discord-voice-assistant/va-piper
#   ghcr.io/<owner>/discord-voice-assistant/va-whisper

on:
  push:
    branches: ["claude/gpu-cloud-deployment-msrcy3", "main"]
    paths:
      - "apps/server/**"
      - "services/piper/**"
      - "deploy/whisper/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-images.yml"
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: va-server
            context: .
            dockerfile: apps/server/Dockerfile
          - name: va-piper
            context: services/piper
            dockerfile: services/piper/Dockerfile
          - name: va-whisper
            context: deploy/whisper
            dockerfile: deploy/whisper/Dockerfile
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
