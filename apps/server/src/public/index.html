<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Live-Transkript</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>Live-Transkript</h1>
      <span id="voice" class="voice voice--unknown" title="Voice-Status">🎙 unbekannt</span>
      <span id="status" class="status status--connecting" title="Datenverbindung (SSE/Polling)">●&nbsp;verbinde…</span>
    </div>
    <div class="topbar-right">
      <details id="members-pop" class="members-pop" hidden>
        <summary id="members-toggle" title="Im Voice-Channel">👥&nbsp;<span id="members-count">0</span></summary>
        <ul id="members-list" class="members-list"></ul>
      </details>
      <label class="field">
        <span>Session</span>
        <select id="session-select"></select>
      </label>
      <label class="toggle" title="Auch beendete Sessions aus dem Log anzeigen">
        <input type="checkbox" id="past-toggle" />
        <span>vergangene</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="debug-toggle" />
        <span>Debug</span>
      </label>
      <button id="open-settings" class="btn-icon" title="Einstellungen" aria-haspopup="dialog">⚙ Einstellungen</button>
    </div>
  </header>

  <!-- Settings-Panel (Overlay). Inhalt wird von settings.js gerendert. -->
  <div id="settings-overlay" class="settings-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel">
      <header class="settings-head">
        <h2 id="settings-title">⚙ Einstellungen</h2>
        <span id="settings-botconn" class="chip chip--muted" title="Bot-Control-Verbindung">Bot: —</span>
        <div class="settings-head-right">
          <input type="search" id="settings-filter" class="settings-filter" placeholder="filtern (Name, Variable, Text)…" />
          <button id="settings-close" class="btn-icon" title="Schließen">✕</button>
        </div>
      </header>

      <div id="settings-legend" class="settings-legend"></div>

      <div class="settings-persistbar">
        <fieldset class="persist-mode">
          <legend>Speichermodus</legend>
          <label class="radio"><input type="radio" name="persist" value="persist" checked /> <b>Dauerhaft</b> — schreibt in den Override-Layer, übersteht Neustart</label>
          <label class="radio"><input type="radio" name="persist" value="temp" /> <b>Nur temporär</b> — nur zur Laufzeit, geht bei Neustart verloren</label>
        </fieldset>
        <div class="settings-actions">
          <span id="settings-dirty" class="chip chip--warn" hidden>0 Änderungen</span>
          <button id="settings-save" class="btn-primary" disabled>Änderungen anwenden</button>
        </div>
      </div>

      <div id="settings-result" class="settings-result" hidden></div>
      <div id="settings-body" class="settings-body"><p class="empty">Lade Konfiguration…</p></div>
    </div>
  </div>

  <details id="session-meta" class="session-meta" hidden>
    <summary>Session-Infos</summary>
    <dl id="session-meta-body" class="session-meta-body"></dl>
  </details>

  <details id="summary-box" class="summary" hidden>
    <summary>Zusammenfassung (gefaltete ältere Turns)</summary>
    <div id="summary-text" class="summary-text"></div>
  </details>

  <main id="transcript" class="transcript" aria-live="polite">
    <p class="empty" id="empty-hint">Warte auf Transkript…</p>
  </main>

  <button id="jump-latest" class="jump-latest" hidden>↓ Neueste</button>

  <script src="app.js" defer></script>
  <script src="settings.js" defer></script>
</body>
</html>
