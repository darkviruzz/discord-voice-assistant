# ============================================================================
# Discord Voice Assistant — server-side stack for temporary GPU cloud instances.
#
#   start:  deploy/scripts/start.sh
#   stop:   deploy/scripts/stop.sh
#   health: deploy/scripts/healthcheck.sh
#
# All services share the internal `voice` network and reach each other by
# service name (e.g. http://whisper:8080). Only the Node server port is
# published — bind it to the WireGuard/Tailscale interface (see README).
#
# GPU: every service requests an NVIDIA GPU. Which physical GPU each one uses is
# controlled per-service via CUDA_VISIBLE_DEVICES (see .env.example for the
# RTX 4090 / 2x A100 / H200 staging plan).
# ============================================================================

services:
  whisper:
    # Pre-built image from the registry (CI publishes it). On the target host:
    #   docker compose pull && docker compose up -d
    # `build:` is used by CI / local builds and tags the result as `image:`.
    image: ${REGISTRY:-ghcr.io/darkviruzz/discord-voice-assistant}/va-whisper:${IMAGE_TAG:-latest}
    # CUDA build from source (deploy/whisper/Dockerfile). To use the official
    # image instead, comment `build:` and uncomment the image/entrypoint block.
    build:
      context: ./whisper
      args:
        WHISPER_CPP_REF: ${WHISPER_CPP_REF:-master}
        CUDA_ARCHS: ${CUDA_ARCHS:-80;86;89;90}
    # image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    # entrypoint: ["whisper-server"]
    # command: ["--model","/models/${WHISPER_MODEL_FILE:-ggml-medium-q5_0.bin}","--host","0.0.0.0","--port","8080","--language","${WHISPER_LANGUAGE:-de}"]
    container_name: va-whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL_FILE: ${WHISPER_MODEL_FILE:-ggml-medium-q5_0.bin}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-de}
      NVIDIA_VISIBLE_DEVICES: ${WHISPER_VISIBLE_DEVICES:-0}
    volumes:
      - whisper-models:/models
    networks: [voice]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: va-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_VISIBLE_DEVICES:-0}
    volumes:
      - ollama-models:/root/.ollama
    networks: [voice]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  piper:
    image: ${REGISTRY:-ghcr.io/darkviruzz/discord-voice-assistant}/va-piper:${IMAGE_TAG:-latest}
    build:
      context: ../services/piper
      dockerfile: Dockerfile
    container_name: va-piper
    restart: unless-stopped
    environment:
      PIPER_VOICES_DIR: /voices
      PIPER_USE_DIRECTML: "0"
      PIPER_USE_CUDA: ${PIPER_USE_CUDA:-1}
      NVIDIA_VISIBLE_DEVICES: ${PIPER_VISIBLE_DEVICES:-0}
    volumes:
      - piper-voices:/voices
    networks: [voice]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  server:
    image: ${REGISTRY:-ghcr.io/darkviruzz/discord-voice-assistant}/va-server:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: va-server
    restart: unless-stopped
    # Publish ONLY on the WireGuard/Tailscale interface (no public exposure).
    # Set SERVER_BIND to the instance's wg IP (e.g. 10.10.0.2); 127.0.0.1 keeps
    # it host-local until the tunnel is configured. 0.0.0.0 = all interfaces.
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-7440}:7440"
    environment:
      HOST: 0.0.0.0
      PORT: "7440"
      CONTROL_BEARER: ${CONTROL_BEARER:?set CONTROL_BEARER in deploy/.env}
      DEBUG: ${DEBUG:-0}
      # Service URLs resolve over the internal network by service name.
      WHISPER_URL: http://whisper:8080
      OLLAMA_URL: http://ollama:11434
      TTS_URL: http://piper:5000
      RAG_URL: ${RAG_URL:-}
      RAG_TIMEOUT_MS: ${RAG_TIMEOUT_MS:-800}
      RAG_BRIEFING_ENABLED: ${RAG_BRIEFING_ENABLED:-true}
      RAG_BRIEFING_TOP_K: ${RAG_BRIEFING_TOP_K:-3}
      RAG_BRIEFING_POST_CHAT: ${RAG_BRIEFING_POST_CHAT:-false}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-de}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      TTS_PROVIDER: ${TTS_PROVIDER:-piper}
      FINALIZE_UPLOAD_DIR: /data/uploads
      ARCHIVE_DIR: /data/archive
      SPEAKER_MAP_FILE: /data/speaker-map.json
      # Default './transcripts' resolves relative to the app's WORKDIR, which
      # the non-root container user can't mkdir — pointed at the already-
      # writable /data volume instead (was silently failing every event:
      # "transcript: log error: EACCES: permission denied, mkdir './transcripts'").
      TRANSCRIPT_DIR: /data/transcripts
      FINALIZE_TZ: ${FINALIZE_TZ:-Europe/Berlin}
      # Campaign context source (pulled into the campaign volume by start.sh).
      OBSIDIAN_VAULT_PATH: /data/campaign
      CAMPAIGN_CONTEXT_FILE: ${CAMPAIGN_CONTEXT_FILE:-CAMPAIGN.md}
      # STT provider (default: the whisper service above via WHISPER_URL).
      STT_PROVIDER: ${STT_PROVIDER:-whispercpp}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_TIMEOUT_MS: ${STT_TIMEOUT_MS:-120000}
      # TTS provider settings (TTS_PROVIDER=openai etc.) — see deploy/.env.example.
      TTS_TIMEOUT_MS: ${TTS_TIMEOUT_MS:-30000}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_RESPONSE_FORMAT: ${TTS_RESPONSE_FORMAT:-pcm}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-24000}
      TTS_SPEED: ${TTS_SPEED:-}
    env_file:
      - path: ./server.env
        required: false
    volumes:
      - transcripts:/data/uploads
      - archive:/data/archive
      - server-data:/data
      - campaign:/data/campaign:ro
    networks: [voice]
    depends_on:
      whisper:
        condition: service_started
      ollama:
        condition: service_started
      piper:
        condition: service_started
      rag:
        condition: service_started

  # ── RAG (Phase 4) — semantic search over the Obsidian vault ────────────────
  # Deliberately NO NVIDIA_VISIBLE_DEVICES / GPU reservation here, unlike the
  # services above: this container does no computation of its own — embeddings
  # are produced by the `ollama` service over HTTP (OLLAMA_URL), so `rag` only
  # ever needs CPU.
  rag:
    image: ${REGISTRY:-ghcr.io/darkviruzz/discord-voice-assistant}/va-rag:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/rag/Dockerfile
    container_name: va-rag
    restart: unless-stopped
    environment:
      VAULT_PATH: /data/campaign
      CHROMA_DIR: /data/chroma
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      RAG_EMBED_KEEP_ALIVE: ${RAG_EMBED_KEEP_ALIVE:-30m}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-}
    # Vault read-only; the chroma volume is chowned to the container's `app`
    # user by the image entrypoint before it drops root (fresh named volumes
    # are root-owned).
    volumes:
      - campaign:/data/campaign:ro
      - rag-chroma:/data/chroma
    networks: [voice]
    # service_started is enough: the service retries its startup index with
    # backoff until ollama (and the embed model) is ready.
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      # python is the only HTTP client in the slim image (no curl). 127.0.0.1,
      # not localhost: uvicorn listens on IPv4 only.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

networks:
  voice:
    driver: bridge

volumes:
  ollama-models:
  whisper-models:
  piper-voices:
  transcripts:
  archive:
  server-data:
  campaign:
  rag-chroma:
